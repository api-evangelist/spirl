name: Spirl
description: >-
  Spirl is a non-human identity and access management (IAM) startup that in 2025
  rebranded to Defakto (defakto.security); spirl.com now redirects to the Defakto
  site. The company secures automated systems — workloads, services, CI/CD
  pipelines, Kubernetes, and AI agents — by replacing static secrets and
  hardcoded credentials with short-lived, cryptographically verifiable
  identities built on open workload-identity standards (SPIFFE/SPIRE style).
  Co-founded by Eli Nesterov (ex-ByteDance infrastructure) and Danny Oliveri, it
  targets the enterprise gap where organizations run millions of non-human
  identities protected only by static secrets. Defakto was named a 2025 Gartner
  Cool Vendor in Identity-First Security. It is a portfolio company of Bloomberg
  Beta. As of this profile the company publishes a marketing site, blog, and
  security page but no public developer API, OpenAPI specification, SDKs, CLI, or
  developer portal — access is via demo request, so there is no API surface to
  enrich at this time.
